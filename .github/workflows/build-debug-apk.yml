name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble github debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Archive matching source
        run: bash tools/package-source.sh

      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Verify packaged audio notices
        run: python3 app/src/test/packaging/check_audio_notices.py app/build/outputs/apk/github/debug/*.apk

      - name: Upload debug APK and matching source
        uses: actions/upload-artifact@v4
        with:
          name: open-headunit-github-debug
          path: |
            app/build/outputs/apk/github/debug/*.apk
            build/source/open-headunit-source.tar.gz
            build/source/SOURCE_REVISION.txt
            build/source/SOURCE_SHA256.txt
          if-no-files-found: error
