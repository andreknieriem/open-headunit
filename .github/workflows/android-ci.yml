name: Android CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only; this workflow needs no write scopes and touches no secrets,
# so it runs unchanged on pull requests opened from forks.
permissions:
  contents: read

jobs:
  build:
    name: Build (github debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # NDK/CMake versions are pinned in app/build.gradle.kts; install the
      # exact versions rather than relying on whatever the runner ships.
      # Retried because sdkmanager downloads occasionally arrive corrupt
      # ("Error on ZipFile unknown archive") on GitHub-hosted runners.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # github flavor only: the playstore flavor cannot compile because
      # VpnControl.kt lives solely in app/src/github. When that source-set
      # split is fixed, add an assemblePlaystoreDebug build here.
      - name: Assemble github debug APK
        run: ./gradlew :app:assembleGithubDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-github-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn

  unit-test:
    name: Unit tests (github debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Robolectric fetches its Android jars (about 560 MB for SDK 28, 30, 34 and 35) from
      # Maven Central at test time, into ~/.m2, which setup-gradle does not cache. A failed
      # fetch fails whole test classes, so keep them between runs.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts', 'app/src/test/resources/robolectric.properties') }}
          restore-keys: robolectric-

      - name: Run unit tests
        run: ./gradlew :app:testGithubDebugUnitTest --stacktrace

      # Gradle populates the Kotlin compiler/runtime cache used by this host harness.
      # Explicit bash preserves a Python failure through tee, so this check fails too.
      - name: Run connection lifecycle harness
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p build
          python3 -u app/src/test/host-connection/run.py 2>&1 | tee build/host-connection.log

      - name: Upload connection lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-connection-diagnostics
          path: |
            build/host-connection.log
            build/host-connection/**/*.json
            build/host-connection/**/*.kt
          if-no-files-found: ignore

      # annotate_only writes annotations and a job summary without a check run, so it
      # needs no write token and works on pull requests from forks.
      - name: Annotate failing tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: app/build/test-results/testGithubDebugUnitTest/*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testGithubDebugUnitTest
            app/build/test-results/testGithubDebugUnitTest
          if-no-files-found: warn

  source-checks:
    name: Source checks (workflows, generated protobuf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint checks syntax, expressions and run scripts; zizmor checks security.
      # Both are pinned, and actionlint's download is checked against its release checksum.
      - name: actionlint
        run: |
          curl -sSLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

      - name: zizmor
        if: ${{ !cancelled() }}
        run: pipx run zizmor==1.33.1 --offline --format github .github/workflows

      # The build does not run protoc: the Java is committed, so a .proto edit needs a
      # regeneration with protoc 25.1 in the same commit. This job redoes it and fails on any diff.
      - name: Regenerate with protoc 25.1
        if: ${{ !cancelled() }}
        run: |
          curl -sSLo protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip
          echo "ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50  protoc.zip" | sha256sum -c -
          unzip -q protoc.zip -d "$RUNNER_TEMP/protoc"
          cd app/src/main/proto
          for f in *.proto; do "$RUNNER_TEMP/protoc/bin/protoc" "$f" --java_out=../java/; done

      - name: Fail on protobuf drift
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet -- app/src/main/java; then
            {
              echo "### Generated protobuf Java does not match the .proto files"
              echo "Run protoc 25.1 on each changed .proto (see app/src/main/proto/gen.sh) and commit the result."
              echo '```'
              git diff --stat -- app/src/main/java
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- app/src/main/java
            echo "::error::Generated protobuf Java is out of date with app/src/main/proto"
            exit 1
          fi

  lint-gate:
    name: Lint (old Android APIs, format strings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # -PlintGate runs NewApi, InlinedApi, StringFormatMatches and StringFormatInvalid only,
      # and fails on any finding not in app/lint-baseline-gate.xml (see app/build.gradle.kts).
      - name: Run lint gate
        run: ./gradlew :app:lintGithubDebug -PlintGate --stacktrace

      - name: Summarise new findings
        if: ${{ failure() }}
        run: |
          {
            echo "### New lint findings"
            echo "A call above minSdk 16 crashes old units; guard it with Build.VERSION.SDK_INT or use an older API."
            echo '```'
            grep -E "Error: " app/build/reports/lint-results-githubDebug.txt | head -n 50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-gate-report
          path: app/build/reports/lint-results-githubDebug.*
          if-no-files-found: ignore

  dex-api-check:
    name: Dex API check (java.* above minSdk)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: app-github-debug-apk
          path: apk

      # Lint misses Java 8 members called on Kotlin collection types, such as removeIf on an
      # ArrayList. This reads the built dex and fails on a java.* call above minSdk 16 that
      # app/dex-api-baseline.txt does not list. Uses the runner's newest SDK tools.
      - name: Check java.* calls against minSdk 16
        run: |
          dexdump="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -n 1)"
          api="$(printf '%s\n' "$ANDROID_HOME"/platforms/android-*/data/api-versions.xml | sort -V | tail -n 1)"
          echo "Using $dexdump and $api"
          python3 -I .github/scripts/dex-api-check.py apk/*.apk "$api" "$dexdump" 16 app/dex-api-baseline.txt

  emulator-smoke:
    name: Start-up on API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [16, 19, 21, 23]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: app-github-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Robolectric runs API 23 and up only, so this is the one check on the old versions
      # minSdk 16 allows. Animations stay on: the runner turns them off through
      # "settings put global", which API 16 does not have.
      - name: Start the app on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload smoke logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-api-${{ matrix.api-level }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
