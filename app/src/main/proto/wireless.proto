syntax = "proto2";

package com.andrerinas.openheadunit.aap.protocol.proto;

// The Android Auto WiFi Projection Protocol, spoken over RFCOMM before the phone joins our
// network. The "type N" in each comment is the message type from the wire header (see
// WppFraming/WppMessageType), not a field number.
//
// Shapes cross-checked against aa-proxy-rs's src/bluetooth.rs and the OEM ZLink app. Types 4, 5,
// 10 and 11 and their nested messages are decoded from Gearhead 17.5.663204 and 17.8.163744, whose
// layouts are byte-identical. Fields we never receive are left undefined on purpose: an absent
// field costs nothing, a wrong one silently mis-parses.
//
// Several fields the phone declares as enums are plain int32 here on purpose: a real phone answered
// -8 on one, which a narrower declaration rendered unreadable.

enum AccessPointType {
    STATIC = 0;
    DYNAMIC = 1;
}

// What the head unit's access point can offer. Android Auto answers
// STATUS_NO_SUPPORTED_WIFI_CHANNELS (-8) when it cannot match our bands.
enum WifiChannelType {
    CHANNELS_5GHZ_ONLY = 0;
    CHANNELS_24GHZ_ONLY = 1;
    CHANNELS_DUAL_BAND = 2;
    NO_CHANNELS_SUPPORTED = 3;
}

enum SecurityMode {
    UNKNOWN_SECURITY_MODE = 0;
    OPEN = 1;
    WEP_64 = 2;
    WEP_128 = 3;
    WPA_PERSONAL = 4;
    WPA2_PERSONAL = 8;
    WPA_WPA2_PERSONAL = 12;
    WPA_ENTERPRISE = 20;
    WPA2_ENTERPRISE = 24;
    WPA_WPA2_ENTERPRISE = 28;
    WPA3_PERSONAL = 32;
    WPA2_WPA3_PERSONAL = 40;
}

// Why this head unit refused the phone's WPP-over-TCP dial, on WifiConnectionRejection.
//
// The numbers are the phone's own: it verifies the field against {0,1,2} and throws on anything
// else. UNKNOWN throws on arrival whatever the transport, so it is declared to read a capture and
// must never be sent.
enum ConnectionRejectionReason {
    CONNECTION_REJECTION_REASON_UNKNOWN = 0;
    CONNECTION_REJECTION_REASON_MOBILE_DEVICE_ID_NOT_FOUND = 1;
    CONNECTION_REJECTION_REASON_INVALID_SETUP_TOKEN = 2;
}

// Type 1, head unit -> phone. Where to open the projection session once associated.
message WifiStartRequest {
    required string ip_address = 1;
    required int32 port = 2;
    optional int32 status = 3;
}

// Type 2, phone -> head unit. Empty: the phone asking for the network credentials. Modelled so
// the payload can be parsed rather than merely counted.
message WifiInfoRequest {
}

// Type 3, head unit -> phone. The credentials themselves.
//
// bssid, security_mode and access_point_type are `required` in the schema every other
// implementation uses — aa-proxy-rs and WirelessAndroidAutoDongle ship byte-identical copies of it.
// Relaxed to optional here so a truncated or future message still parses rather than throwing, and
// that is the only reason. Wire-compatible either way: proto2 encodes optional and required
// identically for a field that is set.
//
// It does not license leaving one out. Send all five, always — an empty bssid where there is no
// real one, as aa-proxy-rs does on the one path where it has none. A field the reference schema
// calls required is one a strict parser on the phone may refuse the whole message over, and that
// failure would look nothing like the credentials being wrong.
message WifiInfoResponse {
    required string ssid = 1;
    required string key = 2;
    optional string bssid = 3;
    optional SecurityMode security_mode = 4;
    optional AccessPointType access_point_type = 5;
}

// Where the phone should open the WPP session when it runs over TCP instead of RFCOMM. Carried on
// WifiVersionRequest; the phone stores it against our Bluetooth address and dials it on later
// connections. Both fields are copied out without a presence check, so an omitted one becomes ""
// or 0 and fails later at socket creation - always set both. An ip_address of "0.0.0.0" is a
// supported "use the gateway" signal rather than an error.
message WifiProjectionProtocolInfo {
    optional string ip_address = 1;
    optional int32 port = 2;
}

// Who we say we are, on WifiVersionRequest. The same identity ServiceDiscoveryResponse announces,
// and not decorative: at protocol 4.1 the phone accepts the WPP-over-TCP endpoint only for a make
// on its own allowlist, which is why we announce 4.2 instead and clear that check.
//
// Fields 5-8 are matched by position against the ServiceDiscoveryResponse layout rather than read
// from a capture, so they are the least certain part of this message. body_type is 2 for a model
// name ending in "truck" and 1 otherwise, which is the same rule ServiceDiscoveryResponse notes.
message WppCarInfo {
    optional string make = 1;
    optional string model = 2;
    optional string model_year = 3;
    optional string vehicle_id = 4;
    optional string head_unit_make = 5;
    optional string head_unit_model = 6;
    optional string head_unit_software_build = 7;
    optional string head_unit_software_version = 8;
    // Declared and never sent. Field 9 is a real int32 in the schema the phone parses - both
    // decompiled builds declare it - but nothing recovers what it carries, and fields 5-8 above
    // are already the least certain part of this message.
    optional int32 body_type = 9;
}

// Type 4, head unit -> phone. Opens the modern handshake by declaring our protocol version, and
// carries the two things the phone needs to reach us over TCP later: where to dial, and who we
// are. Below protocol 4.1 the phone skips wpp_info entirely, which is why the version matters.
//
// Field 3 says which bands our access point can offer; the phone's own parser reads it, and -8
// STATUS_NO_SUPPORTED_WIFI_CHANNELS is what it answers when it cannot match them. Field 4 is the
// frequency list, modelled so a capture reads but never sent: nothing here can enumerate it.
message WifiVersionRequest {
    optional int32 major = 1;
    optional int32 minor = 2;
    optional WifiChannelType supported_wifi_channel_type = 3;
    repeated int32 supported_wifi_channels = 4 [packed = true];
    optional WppCarInfo car_info = 5;
    optional WifiProjectionProtocolInfo wpp_info = 6;
}

// Type 5, phone -> head unit. Parsed for the log only; nothing branches on it. status is int32:
// a real phone answered -8 here, which a sint32 declaration rendered as 2147483644.
message WifiVersionResponse {
    optional int32 major = 1;
    optional int32 minor = 2;
    optional string device_serial = 3;
    optional int32 status = 4;
    optional int32 selected_wifi_channel_type = 5;
    optional WppWifiDeviceInfo device_info = 6;
    // Present in Android Auto 17.5 and 17.8, absent from every schema we had. Contents unknown;
    // modelled so a session can log it.
    optional bytes unknown_blob_7 = 7;
}

// Field 6 of WifiVersionResponse. Named from the schema's own descriptor rather than guessed at.
// Logged only; nothing branches on it.
message WppWifiDeviceInfo {
    optional string device_id = 1;
    optional string connectivity_lifetime_id = 2;
    // Two more strings the phone declares and this had never modelled. Logged so a capture can
    // name them; what they carry is unrecovered.
    optional string unknown_string_3 = 3;
    optional string unknown_string_4 = 4;
}

// Type 6, phone -> head unit: did it get onto our network. The only join feedback that works on
// both transports — WiFi Direct also has the P2P client list, a hotspot has no public equivalent.
// Observed 0 for success. Plain int32, not sint32: a capture of a real phone's type 5 carried -8,
// which read back as 2147483644 while these were declared sint32 (zigzag). Only ==0 vs !=0 is
// branched on either way, so that was a wrong log number rather than a wrong decision.
message WifiConnectStatus {
    optional int32 status = 1;
    // The phone's own words for why it did not join, where it sends any. The one free diagnostic
    // on the one message that reports whether it got onto our network.
    optional string error_message_hint = 2;
}

// Type 7, phone -> head unit. Acknowledges type 1 and reports the address it will connect from.
// Field 2 was left unclaimed while it was unobserved; the schema's own descriptor names it as the
// port, so it is claimed rather than guessed at.
message WifiStartResponse {
    optional string ip_address = 1;
    optional int32 port = 2;
    optional int32 status = 3;
}

// Types 8 and 9: a keepalive the phone may interject anywhere. We answer type 8 by echoing its
// raw payload as a type 9 without parsing, so these are for reading captures, not for the reply.
message WifiPingRequest {
    optional int64 timestamp = 1;
}

message WifiPingResponse {
    optional int64 timestamp = 1;
}

// Type 10, head unit -> phone, and only over TCP: the phone throws on one that arrives over
// RFCOMM, and on an unknown reason whatever the transport. Both sendable reasons reach the phone's
// own clear path, which is the only candidate for sending a phone that already holds an endpoint
// back to the RFCOMM handshake. That the path deletes the record was read on 17.5 and not
// reproduced on 17.8, so it is measured on hardware rather than assumed.
message WifiConnectionRejection {
    optional ConnectionRejectionReason reason = 1;
}

// Field 5 of WifiSetupInfo: the access point the phone is being pointed at. There is no field 5 in
// the phone's own layout and the channel list sits at 6, in MHz. The three strings are real but
// unnamed; field 4 is verified by the same object as WifiInfoResponse.security_mode, which is what
// names it.
message AccessPointInfo {
    optional string unknown_string_1 = 1;
    optional string unknown_string_2 = 2;
    optional string unknown_string_3 = 3;
    optional SecurityMode security_mode = 4;
    repeated int32 supported_wifi_channels = 6 [packed = true];
}

// Type 11. Defined so a capture can be read; never sent. It writes the same record on the phone
// that wpp_info does and is refused over anything but RFCOMM, so sending one carries the endpoint's
// risk with none of its control. Fields 1 and 2 are two int32s the phone declares; the names are
// ours and unconfirmed.
message WifiSetupInfo {
    optional int32 major = 1;
    optional int32 minor = 2;
    optional bytes unknown_blob_3 = 3;
    optional WifiProjectionProtocolInfo wpp_info = 4;
    optional AccessPointInfo access_point_info = 5;
}

// The payload of Android Auto's own wireless-setup QR code, url-safe base64 encoded into the
// `data` query parameter of https://androidauto.com/projection/... . Scanning one writes these
// straight into the phone's list of known cars and starts a WPP session.
//
// It is the only way to seed the TCP endpoint on a head unit whose Bluetooth adapter the phone
// cannot reach: with no RFCOMM channel there is no WifiVersionRequest to carry it. bluetooth_mac
// is the identity the phone keys the record on and must be a device it is actually connected to;
// nothing checks that it is this head unit.
//
// Every field is validated on the phone before any of it is stored, each with its own error, so a
// malformed one is refused outright rather than half-applied.
message ProjectionDeepLinkData {
    optional string ssid = 1;
    optional string bssid = 2;
    optional string passkey = 3;
    optional string wpp_tcp_ip = 4;
    optional int32 wpp_tcp_port = 5;
    optional string bluetooth_mac = 6;
    optional SecurityMode security_mode = 7;
}
