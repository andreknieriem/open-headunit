syntax = "proto2";

package com.andrerinas.openheadunit.aap.protocol.proto;
option java_outer_classname = "Media";

enum MsgType
{
    MEDIA_MESSAGE_DATA = 0;
    MEDIA_MESSAGE_CODEC_CONFIG = 1;
    MEDIA_MESSAGE_SETUP = 0x8000;
    MEDIA_MESSAGE_START = 0x8001;
    MEDIA_MESSAGE_STOP = 0x8002;
    MEDIA_MESSAGE_CONFIG = 0x8003;
    MEDIA_MESSAGE_ACK = 0x8004;
    MEDIA_MESSAGE_MICROPHONE_REQUEST = 0x8005;
    MEDIA_MESSAGE_MICROPHONE_RESPONSE = 0x8006;
    MEDIA_MESSAGE_VIDEO_FOCUS_REQUEST = 0x8007;
    MEDIA_MESSAGE_VIDEO_FOCUS_NOTIFICATION = 0x8008;
    MEDIA_MESSAGE_UPDATE_UI_CONFIG_REQUEST = 0x8009;
    MEDIA_MESSAGE_UPDATE_UI_CONFIG_REPLY = 0x800A;
    MEDIA_MESSAGE_AUDIO_UNDERFLOW_NOTIFICATION = 0x800B;
    MEDIA_MESSAGE_STATS = 0x8013; // HU -> phone; independent of DATA acknowledgements.
    MEDIA_MESSAGE_OPTIONS = 0x8014;
}

enum MediaCodecType
{
    MEDIA_CODEC_AUDIO_PCM = 1;
    MEDIA_CODEC_AUDIO_AAC_LC = 2;
    MEDIA_CODEC_VIDEO_H264_BP = 3;
    MEDIA_CODEC_AUDIO_AAC_LC_ADTS = 4;
    MEDIA_CODEC_VIDEO_VP9 = 5;
    MEDIA_CODEC_VIDEO_AV1 = 6;
    MEDIA_CODEC_VIDEO_H265 = 7;
}

enum AudioStreamType
{
    NONE = 0;
    SPEECH = 1;
    SYSTEM = 2;
    MEDIA = 3;
    ALARM = 4;
    GUIDANCE = 5;
    ANNOUNCEMENT = 6;
    RING = 7;
}

message AudioConfiguration
{
    required uint32 sample_rate = 1;
    required uint32 number_of_bits = 2;
    required uint32 number_of_channels = 3;
}

message Start
{
    required int32 session_id = 1;
    required uint32 configuration_index = 2;
    // Value 2 bypasses the DATA credit controller; names of 0/1 are not recovered.
    enum FlowControl { MODE_0 = 0; MODE_1 = 1; ACKLESS = 2; }
    optional FlowControl flow_control = 3;
    optional MediaOptions options = 4;
}

// Wire-compatible with google.protobuf.Duration (ordinary signed varints, not ZigZag).
message MediaDuration {
    optional int64 seconds = 1;
    optional int32 nanos = 2;
}

// Field layout used by AA18 Start field 4 and message 0x8014. Their application semantics
// may differ: optional presence is retained, not evidence of full-snapshot updates.
// Values are requests, not measured timing or a defined receiver clock relationship.
message MediaOptions {
    optional MediaDuration audio_buffer_limit = 1;
    optional bool enable_av_sync = 2;
    optional MediaDuration max_lag_tolerance = 3;
    optional MediaDuration sync_interval = 4;
    optional MediaDuration max_audio_delay_allowed = 5;
    optional MediaDuration max_video_delay_allowed = 6;
    optional uint32 average_lag_weight = 7;
    optional MediaDuration sync_offset_override = 8;
    optional bool enable_media_stats = 9;
    optional MediaDuration media_stats_report_interval = 10;
    optional bool enable_video_timing_controller = 11;
    optional MediaDuration video_timing_controller_min_delay = 12;
    optional MediaDuration video_timing_controller_max_delay = 13;
}

// Ordinary signed int64 values in microseconds; count is observations, not audio frames.
message MediaDistribution {
    optional int64 average = 1;
    optional int64 minimum = 2;
    optional int64 maximum = 3;
    optional int64 count = 4;
}

// Omit an unmeasured metric instead of reporting a synthetic zero.
message MediaStats {
    optional MediaDuration observation_window = 1;
    optional int64 frames = 2;
    optional int64 audio_overflow_count = 3;
    optional int64 audio_underrun_count = 4;
    optional MediaDistribution estimated_audio_buffer_us = 5;
    optional MediaDistribution av_lag_us = 6;
    optional MediaDistribution audio_delay_us = 7;
    optional MediaDistribution video_delay_us = 8;
    optional int64 audio_output_latency_offset_us = 9;
    optional int64 video_overflow_count = 10;
    optional MediaDistribution video_overflow_duration_us = 11;
    optional MediaDistribution video_frame_jitter_us = 12;
    optional MediaDistribution video_pacing_delay_us = 13;
    optional int64 too_fast_frames = 14;
    optional int64 too_slow_frames = 15;
}

message Ack
{
    required int32 session_id = 1;
    optional uint32 ack = 2;
    repeated uint64 receive_timestamp_ns = 3;
}

// Type 0x800B, head unit -> phone, no reply. One per underflow, only between the first audio
// packet and Stop. Added in AAP 1.6 and must not be sent to a phone that selected less.
message AudioUnderflowNotification
{
    required int32 session_id = 1;
}

message MicrophoneRequest
{
    required bool open = 1;
    optional bool anc_enabled = 2;
    optional bool ec_enabled = 3;
    optional int32 max_unacked = 4;
}

message MicrophoneResponse
{
    required int32 status = 1;
    required uint32 session_id = 2;
}

enum VideoFocusMode
{
    VIDEO_FOCUS_PROJECTED = 1;
    VIDEO_FOCUS_NATIVE = 2;
    VIDEO_FOCUS_NATIVE_TRANSIENT = 3;
    VIDEO_FOCUS_PROJECTED_NO_INPUT_FOCUS = 4;
}

message VideoFocusRequestNotification
{
    enum VideoFocusReason
    {
        UNKNOWN = 0;
        PHONE_SCREEN_OFF = 1;
        LAUNCH_NATIVE = 2;
        VIDEO_FOCUS_REASON_LAST_MODE = 3;
        VIDEO_FOCUS_REASON_USER_SELECTION = 4;
    }

    optional int32 disp_channel_id = 1;
    required VideoFocusMode mode = 2;
    optional VideoFocusReason reason = 3;
}

message VideoFocusNotification
{
    required VideoFocusMode mode = 1;
    required bool unsolicited = 2;
}

message MediaSetupRequest
{
    required uint32 type = 1;
}

message Config
{
    enum ConfigStatus
    {
        STATUS_WAIT = 1;
        STATUS_READY = 2;
    }
    required ConfigStatus status = 1;
    required uint32 max_unacked = 2;
    repeated uint32 configuration_indices = 3;
}

message Insets
{
    optional int32 top = 1;
    optional int32 bottom = 2;
    optional int32 left = 3;
    optional int32 right = 4;
}

message UiConfig
{
    optional Insets margins = 1;
    optional Insets content_insets = 2;
    optional Insets stable_content_insets = 3;
    optional int32 ui_theme = 4;
    // UI elements supplied by the head unit; the phone hides its corresponding widgets.
    enum UiElement {
        UNKNOWN = 0;
        CLOCK = 1;
        BATTERY_LEVEL = 2;
        PHONE_SIGNAL = 3;
        NATIVE_UI_AFFORDANCE = 4;
        NAVIGATION_TURN_DATA_AVAILABLE = 5;
    }
    repeated UiElement ui_elements = 5;
}

message UpdateUiConfigRequest
{
    required UiConfig ui_config = 1;
}

message UpdateUiConfigReply
{
    optional UiConfig ui_config = 1;
}
